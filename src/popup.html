<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Writing Assistant</title>
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: 'Google Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      color: #202124;
      font-size: 18px;
      font-weight: 500;
    }
    
    .header p {
      margin: 5px 0 0 0;
      color: #5f6368;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #202124;
      font-size: 14px;
      font-weight: 500;
    }
    
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #4285f4;
      box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
    }
    
    .btn {
      background: #4285f4;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.15s ease;
    }
    
    .btn:hover {
      background: #3367d6;
    }
    
    .btn:disabled {
      background: #dadce0;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
    }
    
    .status.success {
      background: #e6f4ea;
      color: #137333;
      border: 1px solid #34a853;
    }
    
    .status.error {
      background: #fce8e6;
      color: #c5221f;
      border: 1px solid #ea4335;
    }
    
    .help-text {
      font-size: 12px;
      color: #5f6368;
      margin-top: 8px;
      line-height: 1.4;
    }
    
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .toggle-label {
      font-size: 14px;
      color: #202124;
      font-weight: 500;
    }
    
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #4285f4;
    }
    
    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Writing Assistant</h1>
    <p>Get intelligent writing suggestions in Google Docs</p>
  </div>
  
  <form id="settingsForm">
    <div class="form-group">
      <label for="apiKey">OpenAI API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." required>
      <div class="help-text">
        Your API key is stored locally and never shared. Get one at 
        <a href="https://platform.openai.com/api-keys" target="_blank">OpenAI</a>
      </div>
    </div>
    
    <div class="toggle-group">
      <span class="toggle-label">Enable Autocomplete</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enableAutocomplete" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="toggle-group">
      <span class="toggle-label">Show Suggestions</span>
      <label class="toggle-switch">
        <input type="checkbox" id="showSuggestions" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <button type="submit" class="btn" id="saveBtn">Save Settings</button>
  </form>
  
  <div id="status" class="status" style="display: none;"></div>
  
  <script src="popup.js"></script>
</body>
</html>
